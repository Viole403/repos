[package]
name = "repos"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "repos_lib"
# This is the default, but we explicitly set it here to avoid confusion.
# crate-type = ["staticlib", "cdylib", "rlib"]
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }

# Persistence. SQLite is the default target; mysql/postgres drivers are compiled in
# so the same build can point at any of the three (see src-tauri/src/db.rs).
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "sqlx-mysql",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-json",
] }
sea-orm-migration = { version = "2.0", features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Full debuginfo across every crate and job is the main cause of swap thrash
# during `tauri dev`. Line tables still give a backtrace its line numbers.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
opt-level = 3

# Dependencies are never what you're debugging, and they are most of the build.
[profile.dev.package."*"]
opt-level = 1 # Optimize for speed, not size
debug = 0 # No debug info, just line tables

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# Untuk uji build harian, `cargo build --profile release-fast`
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
strip = false
